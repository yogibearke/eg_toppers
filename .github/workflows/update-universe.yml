name: Update EasyGrowth Dataset

on:
  schedule:
    # Elke weekdag om middernacht (23:00 UTC = 00:00 CET na sluiting Europese & Amerikaanse beurzen)
    - cron: '0 23 * * 1-5'
  workflow_dispatch: # Maakt ook handmatig starten met 1 klik mogelijk via het tabblad 'Actions' op GitHub

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run EasyGrowth Universe Updater
        env:
          TZ: Europe/Brussels
        run: python update_universe.py

      - name: Commit and push updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eg_live_universe.js
          if git diff --staged --quiet; then
            echo "Geen wijzigingen in eg_live_universe.js."
          else
            git commit -m "chore(data): automatische update EasyGrowth dataset ($(date +'%d-%m-%Y'))"
            git push
          fi
